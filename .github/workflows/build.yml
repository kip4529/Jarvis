name: Build Jarvis
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - run: gh release create v${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --title "Jarvis build ${{ github.run_number }}" --notes "Install app-debug.apk"
        env:
          GH_TOKEN: ${{ github.token }}
